server:
  port: 8090
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false  # 关闭 MyBatis-Plus 启动 Logo
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wms001
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB    # 单个文件的最大大小
      max-request-size: 10MB # 单次请求的总文件大小上限
  data:
    redis:
      host: localhost
      port: 6379
      password:               # 本地开发一般无密码，生产环境请设置
      database: 0
      timeout: 3000ms         # 连接超时
      lettuce:
        pool:
          max-active: 8       # 最大连接数
          max-idle: 8         # 最大空闲连接
          min-idle: 2         # 最小空闲连接
          max-wait: -1ms      # 获取连接最大等待时间（-1 表示无限等待）
# JWT 核心配置（必须添加）
jwt:
  # 密钥（必须是32位以上字符串，可随便写，生产环境要随机生成）
  secret: aB3k9sT2pR7xZ8qL5dG1jH6mN4cF0vS2eW
  # 过期时间（秒）：2小时 = 7200秒
  expire-time: 7200
  header: token
